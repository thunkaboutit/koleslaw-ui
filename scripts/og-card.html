<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Koleslaw blog social card</title>

    <!--
      Source for public/og/default.png, the fallback social card for every blog
      post. Rendered by scripts/render-og-card.sh with headless Chrome, which is
      why this is a real page: it uses the site's own palette, fonts, grain, and
      mascot, so the card cannot drift away from the site by hand-copying.

      Edit here, re-run the script, commit both files.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Palette copied from src/assets/base.css. */
      :root {
        --wl-cream: #f5f0e8;
        --wl-navy: #1a2744;
        --wl-gold: #c9a84c;
        --wl-olive: #5a6340;
        --wl-warm-gray: #7a7568;
        --color-text: #4a453c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        /* The same parchment grain the site puts behind every page. */
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")
            repeat 0 0 / 256px 256px,
          var(--wl-cream);
        font-family: 'Nunito', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 32px;
        width: 100%;
        height: 100%;
        padding: 72px 72px 72px 80px;
        border-top: 10px solid var(--wl-gold);
      }

      .copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--wl-olive);
      }

      h1 {
        margin: 18px 0 0;
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        /* Sized to keep the name on one line beside the mascot. Changing the
           wording or the mascot width means re-checking that it still fits. */
        font-size: 72px;
        line-height: 1.05;
        letter-spacing: -0.015em;
        white-space: nowrap;
        color: var(--wl-navy);
      }

      .rule {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 26px 0 22px;
      }

      .rule::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(42, 42, 42, 0.18);
      }

      .diamond {
        width: 10px;
        height: 10px;
        background: var(--wl-gold);
        transform: rotate(45deg);
      }

      .blurb {
        max-width: 640px;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.35;
        color: var(--color-text);
      }

      .tags {
        margin-top: 26px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 500;
        color: var(--wl-warm-gray);
      }

      .mascot {
        flex: 0 0 auto;
        width: 400px;
        /* Nudged down so the speech bubble sits level with the headline. */
        margin-top: 24px;
      }

      .mascot img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="copy">
        <p class="kicker">koleslaw.ai/blog</p>

        <h1>The Koleslaw Blog</h1>

        <div class="rule"><span class="diamond"></span></div>

        <p class="blurb">Notes from running a fine-tuned 30B model in production.</p>

        <p class="tags">quantization · spot GPUs · failure design</p>
      </div>

      <div class="mascot">
        <img src="../src/assets/koleslaw-logo-mascot-woof.svg" alt="" />
      </div>
    </div>
  </body>
</html>
