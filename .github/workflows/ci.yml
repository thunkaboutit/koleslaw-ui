name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Restore SSH remote
        run: git remote set-url origin git@github.com:thunkaboutit/koleslaw-developer-portal.git

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  type-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Restore SSH remote
        run: git remote set-url origin git@github.com:thunkaboutit/koleslaw-developer-portal.git

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run type-check

  build:
    runs-on: self-hosted
    needs: [ lint, type-check ]
    steps:
      - uses: actions/checkout@v5

      - name: Restore SSH remote
        run: git remote set-url origin git@github.com:thunkaboutit/koleslaw-developer-portal.git

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build-only
