name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10

    steps:
      - name: Checkout portal
        uses: actions/checkout@v5
        with:
          path: koleslaw-developer-portal

      - name: Checkout prompt-enhance (docker-compose)
        uses: actions/checkout@v5
        with:
          repository: thunkaboutit/prompt-enhance
          path: prompt-enhance
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portal image
        run: docker compose -f prompt-enhance/docker-compose.dev.yml build portal

      - name: Deploy portal
        run: docker compose -f prompt-enhance/docker-compose.dev.yml up -d portal

      - name: Wait for healthy
        run: |
          echo "Waiting for portal to become healthy..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Portal is healthy."
              exit 0
            fi
            echo "Attempt $i/20 — not ready yet..."
            sleep 3
          done
          echo "Portal did not become healthy in time."
          docker compose -f prompt-enhance/docker-compose.dev.yml logs --tail=50 portal
          exit 1

      - name: Clean up old images
        run: docker image prune -f
